<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>FCM 테스트</title>
<style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; }
    button { padding: 10px 16px; margin: 6px 4px; cursor: pointer; }
    #token { word-break: break-all; background: #f4f4f4; padding: 12px; border-radius: 6px; min-height: 60px; }
    #log { background: #111; color: #0f0; padding: 12px; border-radius: 6px; min-height: 200px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
</style>
</head>
<body>
<h1>FCM 테스트 페이지</h1>

<h3>1. 권한 허용 + 토큰 받기</h3>
<button id="btnToken">FCM 토큰 발급</button>
<button id="btnCopy">토큰 복사</button>
<div id="token">(여기에 토큰 출력)</div>

<h3>2. 다음 단계</h3>
<ol>
    <li>위 토큰 복사해서 Postman 로그인 바디의 <code>fcmToken</code>에 붙여넣기</li>
    <li>로그인 → 서버가 해당 사용자의 fcmToken 저장</li>
    <li>Postman에서 세션 시작 API 호출</li>
    <li>이 탭에 알림이 뜨면 성공 🎉</li>
</ol>

<h3>3. 수신 로그</h3>
<div id="log"></div>

<!-- Firebase SDK v10 (compat 모듈) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
    // ▼▼▼ Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱(웹)에서 복사 ▼▼▼
    const firebaseConfig = {
        apiKey: "AIzaSyByg69lVNuzmS14SWb_9GhX-o9wme-m6m8",
        authDomain: "beacom-98b44.firebaseapp.com",
        projectId: "beacom-98b44",
        storageBucket: "beacom-98b44.firebasestorage.app",
        messagingSenderId: "484018299868",
        appId: "1:484018299868:web:0155126f51d33ea78aa519",
        measurementId: "G-MDWL29ZGK2"
    };
    // ▼▼▼ Firebase 콘솔 > Cloud Messaging > 웹 푸시 인증서에서 복사 ▼▼▼
    const VAPID_KEY = "BK8ZdIJ5CC0fVF1svhYTEBIColh9ATy_L_TTrCgbm7Hqt34l-WVhffGdcHJndb475XzCaf2kppBnTMy_wx4gA7w";

    const log = (msg, cls='') => {
        const el = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        el.innerHTML += `<span class="${cls}">[${time}] ${msg}</span>\n`;
        el.scrollTop = el.scrollHeight;
    };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    document.getElementById('btnToken').onclick = async () => {
        try {
            //Service Worker 등록
            const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
            log('Service Worker 등록 완료', 'ok');

            const permission = await Notification.requestPermission();
            log('알림 권한: ' + permission);
            if (permission !== 'granted') {
                log('권한 거부됨. 브라우저 설정 확인 필요.', 'err');
                return;
            }

            const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
            if (token) {
                document.getElementById('token').innerText = token;
                log('토큰 발급 성공', 'ok');
            } else {
                log('토큰을 발급하지 못했습니다.', 'err');
            }
        } catch (e) {
            log('에러: ' + e.message, 'err');
            console.error(e);
        }
    };

    document.getElementById('btnCopy').onclick = async () => {
        const token = document.getElementById('token').innerText;
        if (!token || token.startsWith('(')) { log('복사할 토큰이 없습니다.', 'err'); return; }
        await navigator.clipboard.writeText(token);
        log('클립보드에 복사됨', 'ok');
    };

    //포그라운드 메시지 수신 (탭이 켜져 있을 때)
    messaging.onMessage((payload) => {
        log('📩 포그라운드 메시지 수신: ' + JSON.stringify(payload), 'ok');
        const n = payload.notification || {};
        new Notification(n.title || '알림', { body: n.body || '' });
    });
</script>
</body>
</html>
