services:
  db:
    image: mysql:8.0
    container_name: beacon-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # 로컬에서 빌드 후 Docker Hub에 푸시한 이미지를 풀해서 실행
    image: ${DOCKERHUB_USERNAME}/beacon:latest
    container_name: beacon-app
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXP_MIN: ${JWT_ACCESS_EXP_MIN}
      JWT_REFRESH_EXP_DAY: ${JWT_REFRESH_EXP_DAY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
